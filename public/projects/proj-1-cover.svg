<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#001A2E"/>
      <stop offset="100%" stop-color="#080B10"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#g1)"/>
  <!-- Grid -->
  <g stroke="#00E5FF" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Rooms/dungeon map -->
  <g stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <rect x="180" y="130" width="100" height="70" rx="2"/>
    <rect x="320" y="100" width="120" height="90" rx="2"/>
    <rect x="490" y="140" width="90" height="65" rx="2"/>
    <rect x="270" y="250" width="80" height="60" rx="2"/>
    <rect x="400" y="240" width="100" height="70" rx="2"/>
    <!-- Corridors -->
    <line x1="280" y1="165" x2="320" y2="145"/>
    <line x1="440" y1="145" x2="490" y2="170"/>
    <line x1="350" y1="190" x2="315" y2="250"/>
    <line x1="380" y1="190" x2="440" y2="240"/>
  </g>
  <!-- Glowing particles -->
  <g filter="url(#glow)" fill="#00E5FF">
    <circle cx="230" cy="165" r="4" opacity="0.9"/>
    <circle cx="380" cy="145" r="3" opacity="0.7"/>
    <circle cx="535" cy="172" r="3.5" opacity="0.8"/>
    <circle cx="310" cy="280" r="2.5" opacity="0.6"/>
  </g>
  <g fill="#00E5FF" opacity="0.3">
    <circle cx="120" cy="80" r="1.5"/><circle cx="660" cy="50" r="1"/><circle cx="740" cy="380" r="2"/>
    <circle cx="50" cy="320" r="1.5"/><circle cx="680" cy="300" r="1"/><circle cx="770" cy="120" r="2"/>
    <circle cx="30" cy="200" r="1"/><circle cx="580" cy="420" r="1.5"/>
  </g>
  <!-- Title -->
  <rect x="0" y="340" width="800" height="110" fill="url(#g1)" opacity="0.85"/>
  <text x="40" y="390" font-family="monospace" font-size="28" font-weight="bold" fill="#F0F6FC" letter-spacing="4">ABYSS PROTOCOL</text>
  <text x="40" y="418" font-family="monospace" font-size="12" fill="#00E5FF" letter-spacing="3" opacity="0.8">ROGUELIKE 2D · UNITY · 2024</text>
