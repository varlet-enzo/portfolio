<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="g2" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="100%" stop-color="#080B10"/>
    </radialGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#g2)"/>
  <!-- Concentric gravity rings -->
  <g stroke="#E8FF47" fill="none">
    <circle cx="400" cy="200" r="200" stroke-opacity="0.06" stroke-width="1.5"/>
    <circle cx="400" cy="200" r="150" stroke-opacity="0.09" stroke-width="1.5"/>
    <circle cx="400" cy="200" r="100" stroke-opacity="0.13" stroke-width="1.5"/>
    <circle cx="400" cy="200" r="55" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="400" cy="200" r="20" stroke-opacity="0.5" stroke-width="2"/>
  </g>
  <!-- Gravity arcs -->
  <g stroke="#FF3F5B" fill="none" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4">
    <path d="M 200 50 Q 400 180 600 50"/>
    <path d="M 150 400 Q 400 220 650 400"/>
    <path d="M 50 200 Q 220 350 50 380"/>
    <path d="M 750 200 Q 580 350 750 380"/>
  </g>
  <!-- Central glow -->
  <circle cx="400" cy="200" r="12" fill="#E8FF47" opacity="0.9" filter="url(#glow2)"/>
  <!-- Platform fragments -->
  <g fill="#8B949E" opacity="0.4">
    <rect x="280" y="290" width="80" height="8" rx="2"/>
    <rect x="440" y="260" width="60" height="8" rx="2" transform="rotate(-15 470 264)"/>
    <rect x="160" y="180" width="50" height="8" rx="2" transform="rotate(30 185 184)"/>
    <rect x="580" y="310" width="70" height="8" rx="2" transform="rotate(-20 615 314)"/>
    <rect x="350" y="110" width="55" height="8" rx="2" transform="rotate(8 377 114)"/>
  </g>
  <!-- Player character suggestion -->
  <g filter="url(#glow2)" fill="#E8FF47" opacity="0.85">
    <rect x="318" y="278" width="6" height="10" rx="1"/>
    <circle cx="321" cy="274" r="4"/>
  </g>
  <!-- Title -->
  <rect x="0" y="340" width="800" height="110" fill="#080B10" opacity="0.8"/>
  <text x="40" y="390" font-family="monospace" font-size="28" font-weight="bold" fill="#F0F6FC" letter-spacing="4">VOIDWALKER</text>
  <text x="40" y="418" font-family="monospace" font-size="12" fill="#E8FF47" letter-spacing="3" opacity="0.8">PLATFORMER 3D · UNREAL ENGINE 5 · 2024</text>
</svg>
