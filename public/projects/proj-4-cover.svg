<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="g4" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#1A1200"/>
      <stop offset="100%" stop-color="#080B10"/>
    </radialGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#g4)"/>
  <!-- Road perspective -->
  <g stroke="#E8FF47" fill="none">
    <!-- Left road edge -->
    <line x1="400" y1="160" x2="80" y2="420" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Right road edge -->
    <line x1="400" y1="160" x2="720" y2="420" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Center dashes -->
    <line x1="400" y1="170" x2="385" y2="240" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="12 8"/>
    <line x1="383" y1="250" x2="350" y2="350" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="16 10"/>
    <line x1="348" y1="363" x2="300" y2="420" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="20 12"/>
    <!-- Horizon glow -->
    <line x1="0" y1="160" x2="800" y2="160" stroke-opacity="0.15" stroke-width="1"/>
  </g>
  <!-- Road fill -->
  <polygon points="400,160 80,420 720,420" fill="#0D1117" opacity="0.6"/>
  <!-- Horizon glow -->
  <ellipse cx="400" cy="160" rx="200" ry="20" fill="#E8FF47" opacity="0.06" filter="url(#glow4)"/>
  <!-- Cars/agents -->
  <g filter="url(#glow4)">
    <!-- Car 1 - player (front) -->
    <rect x="370" y="330" width="28" height="40" rx="3" fill="#E8FF47" opacity="0.9"/>
    <rect x="375" y="335" width="18" height="14" rx="1" fill="#080B10" opacity="0.6"/>
    <!-- Car 2 - AI agent -->
    <rect x="315" y="270" width="22" height="32" rx="2" fill="#FF3F5B" opacity="0.75"/>
    <rect x="320" y="274" width="12" height="10" rx="1" fill="#080B10" opacity="0.5"/>
    <!-- Car 3 - AI agent -->
    <rect x="435" y="280" width="22" height="32" rx="2" fill="#00E5FF" opacity="0.65"/>
    <rect x="440" y="284" width="12" height="10" rx="1" fill="#080B10" opacity="0.5"/>
  </g>
  <!-- Neural network visualization (top right) -->
  <g opacity="0.5" fill="none">
    <g stroke="#E8FF47" stroke-width="1" stroke-opacity="0.4">
      <line x1="600" y1="60" x2="650" y2="90"/><line x1="600" y1="60" x2="650" y2="120"/>
      <line x1="600" y1="100" x2="650" y2="90"/><line x1="600" y1="100" x2="650" y2="120"/>
      <line x1="650" y1="90" x2="700" y2="75"/><line x1="650" y1="120" x2="700" y2="105"/>
    </g>
    <g fill="#E8FF47">
      <circle cx="600" cy="60" r="4" opacity="0.7"/><circle cx="600" cy="100" r="4" opacity="0.7"/>
      <circle cx="650" cy="90" r="4" opacity="0.8"/><circle cx="650" cy="120" r="4" opacity="0.8"/>
      <circle cx="700" cy="75" r="4" opacity="0.9"/><circle cx="700" cy="105" r="4" opacity="0.9"/>
    </g>
  </g>
  <!-- Title -->
  <rect x="0" y="340" width="800" height="110" fill="#080B10" opacity="0.85"/>
  <text x="40" y="390" font-family="monospace" font-size="28" font-weight="bold" fill="#F0F6FC" letter-spacing="4">NEURALRACE</text>
  <text x="40" y="418" font-family="monospace" font-size="12" fill="#E8FF47" letter-spacing="3" opacity="0.8">RACING GAME · UNITY ML-AGENTS · 2023</text>
</svg>
